name: CI

# Every pull request and every push to the main branch: the solution builds, the tests pass on real
# servers, and coverage is reported. A run on the main branch checks what merged on its own, rather
# than on the strength of the pull request it came from.

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # A service is added to All.sln by src/services/manual-add-projects.sh. Forgotten, the service
      # drops out of this build and its tests without anything failing.
      - name: Every service project is in All.sln
        run: |
          solution=$(ls src/services/*.All.sln)
          listed=$(dotnet sln "$solution" list | tr '\\' '/')
          missing=0
          for project in $(find src/services -mindepth 3 -maxdepth 3 -name '*.csproj'); do
            relative=${project#src/services/}
            if ! grep -qF "$relative" <<< "$listed"; then
              echo "::error file=$project::not in $solution; run src/services/manual-add-projects.sh"
              missing=1
            fi
          done
          exit $missing

#if (Database == "mssql")
      # The integration tests restore a database of their own per test from one migrated once. SQL
      # Server on Linux does not run its files on a ramdisk, so they stay on the runner's disk.
      - name: Start SQL Server for the tests
        run: |
          docker run -d --name tests-mssql -p 1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD=Test-do-not-use-1 \
            mcr.microsoft.com/mssql/server:2022-latest
#else
      # The integration tests create and drop a database of their own per test. On a ramdisk with
      # durability off that is several times faster - safe only because the data dies with the job.
      # The ramdisk is larger than max_wal_size: a full one stops the server mid-run.
      - name: Start PostgreSQL for the tests
        run: |
          docker run -d --name tests-pg -p 5432:5432 \
            -e POSTGRES_PASSWORD=test-do-not-use \
            --tmpfs /var/lib/postgresql/data:rw,size=2g \
            postgres:16-alpine \
            -c fsync=off -c synchronous_commit=off -c full_page_writes=off \
            -c max_wal_size=512MB -c autovacuum=off
#endif
#if (ClickHouse)

      - name: Start ClickHouse for the tests
        run: |
          docker run -d --name tests-ch -p 8123:8123 \
            -e CLICKHOUSE_USER=tester -e CLICKHOUSE_PASSWORD=test-do-not-use \
            -e CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1 \
            clickhouse/clickhouse-server:24.8-alpine
#endif
#if (Storage)

      - name: Start S3-compatible storage for the tests
        run: |
          docker run -d --name tests-s3 -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID=tester -e AWS_SECRET_ACCESS_KEY=test-do-not-use \
            chrislusf/seaweedfs server -s3 -dir=/data
#endif
#if (Vault)

      - name: Start Vault for the tests
        run: |
          docker run -d --name tests-vault -p 8200:8200 \
            -e VAULT_DEV_ROOT_TOKEN_ID=test-do-not-use -e VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200 \
            hashicorp/vault:1.17
#endif

      - name: Restore
        run: dotnet restore src/services/*.All.sln

      - name: Build
        run: dotnet build src/services/*.All.sln --configuration Release --no-restore

      # Split from the integration tests so a failure says which kind broke. Selected as "not
      # Integration": only tests that need a server carry a category.
      - name: Unit tests
        run: >
          dotnet test src/services/*.All.sln --configuration Release --no-build
          --filter "TestCategory!=Integration"
          --collect:"XPlat Code Coverage" --results-directory coverage/unit

      - name: Wait for the test servers
        run: |
          for attempt in $(seq 1 60); do
            ready=1
#if (Database == "mssql")
            docker exec tests-mssql /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P Test-do-not-use-1 \
              -Q "SELECT 1" -b >/dev/null 2>&1 || ready=0
#else
            docker exec tests-pg pg_isready -U postgres >/dev/null 2>&1 || ready=0
#endif
#if (ClickHouse)
            curl -fsS http://localhost:8123/ping >/dev/null 2>&1 || ready=0
#endif
#if (Storage)
            echo "s3.bucket.create -name tests" | docker exec -i tests-s3 weed shell -master=localhost:9333 2>&1 \
              | grep -qE 'created|exists' || ready=0
#endif
#if (Vault)
            curl -fsS http://localhost:8200/v1/sys/health >/dev/null 2>&1 || ready=0
#endif
            [ $ready = 1 ] && exit 0
            sleep 1
          done
#if (Database == "mssql")
          docker logs tests-mssql
#else
          docker logs tests-pg
#endif
          exit 1

      - name: Integration tests
        env:
#if (Database == "mssql")
          TEST_SQLSERVER: Server=localhost,1433;User Id=sa;Password=Test-do-not-use-1;TrustServerCertificate=true
#else
          TEST_POSTGRES: Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=test-do-not-use
#endif
#if (ClickHouse)
          TEST_CLICKHOUSE: Host=localhost;Port=8123;Username=tester;Password=test-do-not-use
#endif
#if (Storage)
          TEST_S3: ServiceUrl=http://localhost:8333;Bucket=tests;AccessKey=tester;SecretKey=test-do-not-use
#endif
#if (Vault)
          TEST_VAULT: Address=http://localhost:8200;Token=test-do-not-use
#endif
        run: >
          dotnet test src/services/*.All.sln --configuration Release --no-build
          --filter "TestCategory=Integration"
          --collect:"XPlat Code Coverage" --results-directory coverage/integration

      # One report over unit and integration runs. The threshold below is on branch coverage, which
      # counts whether each branch of a condition ran; line coverage counts a line with an untested
      # branch as covered. Left out is wiring with no logic of its own: EF migrations and model
      # configuration, DI composition, host setup, seeding.
      - name: Coverage report
        if: always()
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.*
          reportgenerator \
            -reports:"coverage/**/coverage.cobertura.xml" \
            -targetdir:coverage/report \
            -reporttypes:"Html;JsonSummary;MarkdownSummaryGithub" \
            -assemblyfilters:"+NamespaceRoot.ProductName.*;-*.Tests" \
            -classfilters:"-*.Migrations.*;-*EntityConfiguration*;-*.Designer;-*Program;-*DependencyInjection*;-*.API.Setup.*;-*.DataSeeding.*;-*MigrationRunner;-*DbContextFactory"
          cat coverage/report/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      # The threshold is a repository variable, so a team raises it as the tests grow instead of
      # editing this file. Not set, the report is shown and nothing fails on it.
      - name: Branch coverage threshold
        if: vars.COVERAGE_MIN_BRANCH != ''
        run: |
          actual=$(jq '.summary.branchcoverage // 0' coverage/report/Summary.json)
          echo "branch coverage ${actual}%, required ${{ vars.COVERAGE_MIN_BRANCH }}%"
          awk -v a="$actual" -v m="${{ vars.COVERAGE_MIN_BRANCH }}" 'BEGIN { exit (a + 0 < m + 0) }'

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/report/
          retention-days: 30
