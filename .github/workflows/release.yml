name: Release

# A tag v<version> publishes a GitHub release of the template and its package on nuget.org. The tag has
# to name the version in version.json, and the release text is that version's release notes, so the two
# cannot drift apart. It has to sit on master, where the template's checks passed: a tag on any other
# commit, or on one whose checks failed, publishes nothing.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A merge into master starts template.yml on the merged commit; a tag set right after the merge
      # waits for it here, up to CHECKS_WAIT_MIN.
      - name: The tag is on master and the template's checks passed on it
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_WAIT_MIN: 40
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/master; then
            echo "::error::$GITHUB_REF_NAME is not on master; a release is made from a commit that passed review and checks"
            exit 1
          fi
          for minute in $(seq 1 "$CHECKS_WAIT_MIN"); do
            runs=$(gh run list -R "$GITHUB_REPOSITORY" --workflow template.yml --commit "$GITHUB_SHA" --json status,conclusion)
            if [ "$(jq '[.[] | select(.status == "completed" and .conclusion == "success")] | length' <<< "$runs")" -gt 0 ]; then
              echo "template.yml passed on $GITHUB_SHA"
              exit 0
            fi
            if [ "$(jq 'length' <<< "$runs")" -gt 0 ] && [ "$(jq '[.[] | select(.status != "completed")] | length' <<< "$runs")" -eq 0 ]; then
              echo "::error::template.yml did not pass on $GITHUB_SHA: $(jq -c '[.[].conclusion]' <<< "$runs")"
              exit 1
            fi
            sleep 60
          done
          echo "::error::no finished template.yml run on $GITHUB_SHA after $CHECKS_WAIT_MIN minutes"
          exit 1

      - name: The tag names the version in version.json
        run: |
          expected="v$(jq -r .version version.json)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME, version.json says $expected"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash scripts/release-notes.sh "$version" > notes.md
          headline=$(jq -r --arg v "$version" '.releaseNotes[$v].headline' version.json)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME: $headline" --notes-file notes.md --verify-tag

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # The package goes on the release in any case, so a version can be installed from a file.
      - name: Pack and attach the template package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dotnet pack DotNetSolutionKit.Templates.csproj --configuration Release -o package
          gh release upload "$GITHUB_REF_NAME" package/*.nupkg

      # nuget.org only with its key in the repository secrets. A version published there cannot be
      # deleted, only unlisted, so it goes out from a tag that passed the template checks.
      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::NUGET_API_KEY is not set; the package is only attached to the release."
            exit 0
          fi
          dotnet nuget push package/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
