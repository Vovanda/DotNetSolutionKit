name: Release

# A tag v<version> publishes a GitHub release of the template. The tag has to name the version in
# version.json, and the release text is that version's release notes, so the two cannot drift apart.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag names the version in version.json
        run: |
          expected="v$(jq -r .version version.json)"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME, version.json says $expected"
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash scripts/release-notes.sh "$version" > notes.md
          headline=$(jq -r --arg v "$version" '.releaseNotes[$v].headline' version.json)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME: $headline" --notes-file notes.md --verify-tag
